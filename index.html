<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal d'Emilie Moreau </title>
    <meta name="author"
        content="Marina Jennequin, Boris Rocchietti, en collaboration avec l'IUT de Tarbes et l'Université néo-zélandaise de [j'ai plus le nom]">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="main">
        <h1 id="titre" class="titre-projet"> Through the Looking Glass</h1>
        <aside>
            <div id="photo" class="img-tape img-tape--3">
                <img src="img/nyan.webp" alt="chat adorable">

            </div>
            <div id="audio" style="padding: 30px;">
                <a onclick="document.querySelector('dialog').showModal()">
                    <img src="img/sticker_casque.png" alt="sticker de casque moderne et vachement joli">
                </a>
                <dialog>
                    <button onclick="this.parentElement.close()">✕</button>
                    <audio controls src="audio.mp3"></audio>
                </dialog>
            </div>
            <div id="bouton-jeu">
                <a href="https://www.google.com">
                    <img src="img/manette_jeu.webp" alt="manette de console stylisée avec un petit côté rétro">
                </a>
            </div>
        </aside>
        <section>
            <div id="page-journal">
                <h1 id="titre-journal">JE SUIS UNE PAGE DE JOURNAL LALALA</h1>
                <p id="texte">coucou</p>
                <h2 id="titre-journal-2"> coucou </h2>
                <p id="texte">salam</p>
                <i id="texte">ITALYYYYY-que</i> <br>
                <b id="texte">You're being a bit too bold if i may say so </b>
            </div>
            <div id="poeme" class="poem">
                Quand le ciel de mon équinoxe est envahi par l'obscurité, <br>
                c'est là que je vois le mieux les étoiles.
            </div>
        </section>
    </main>
</body>

</html>
